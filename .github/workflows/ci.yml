name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets `release.yml` run this exact gate before publishing, so the release path and
  # the everyday path can never drift apart.
  workflow_call:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (${{ matrix.node }})
    runs-on: ubuntu-latest
    # `floor` runs the gate on the lowest Node package.json `engines.node` advertises, so
    # the floor is exercised rather than merely claimed; `24` is the current LTS line.
    # Not fail-fast: the point of two legs is knowing which Node line broke.
    strategy:
      fail-fast: false
      matrix:
        node: ["floor", "24"]

    steps:
      - uses: actions/checkout@v7

      # One source of truth: pnpm-workspace.yaml's `nodeVersion`, which
      # tests/node-floor.test.ts keeps equal to the `engines.node` minimum.
      - name: Resolve Node floor
        id: floor
        run: |
          version=$(sed -n 's/^nodeVersion: *//p' pnpm-workspace.yaml)
          if ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Expected 'nodeVersion: x.y.z' in pnpm-workspace.yaml, got '$version'." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node == 'floor' && steps.floor.outputs.version || matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate fixture Prisma client
        run: pnpm run generate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Duplication check
        run: pnpm run duplicates

      # `pnpm test`, the gate's own test command: every vitest project (unit, integration,
      # integration-no-isolate, integration-url), so CI cannot drift from the gate. The
      # container projects and url mode's stand-in server all run on ubuntu-latest's Docker.
      - name: Tests
        run: pnpm test

      # Not in the gate: url-mode runs sharing one server, one of them killed, and the next
      # run's Sweep dropping what it left. Starts its own Postgres on Docker.
      - name: "url mode: concurrent runs and the Sweep"
        run: pnpm run test:url-concurrent

      - name: Build
        run: pnpm run build

      # tests/package-files.test.ts owns the tarball contract (what may ship, every docs
      # page, every link). It runs before the build, so the built entry points are
      # checked here, once `dist/` exists.
      - name: Check built entry points are packed
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const [{ files }] = JSON.parse(readFileSync('pack.json', 'utf8'));
            const paths = files.map((file) => file.path);
            const missing = ['dist/index.js', 'dist/global-setup.js', 'dist/setup.js'].filter(
              (entry) => !paths.includes(entry),
            );
            if (missing.length > 0) {
              console.error('Missing from tarball:', missing);
              process.exit(1);
            }
            console.log('Tarball OK:', paths.join(', '));
          "
